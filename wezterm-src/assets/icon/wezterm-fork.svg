<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2438"/>
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a8fff"/>
      <stop offset="100%" stop-color="#2855d6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#27c93f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#27c93f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="200" ry="200" fill="url(#bg)"/>

  <!-- 终端轮廓 (大边框) -->
  <rect x="100" y="180" width="824" height="664" rx="48" ry="48" fill="#000814" stroke="#27c93f" stroke-width="8"/>

  <!-- 顶部 chrome 圆点 -->
  <circle cx="160" cy="240" r="18" fill="#ff5f56"/>
  <circle cx="216" cy="240" r="18" fill="#ffbd2e"/>
  <circle cx="272" cy="240" r="18" fill="#27c93f"/>

  <!-- 神经网络节点 (右上 AI 元素) -->
  <g transform="translate(660, 280)" opacity="0.85">
    <!-- 连接线 -->
    <line x1="60" y1="60" x2="160" y2="20" stroke="#5a8fff" stroke-width="3"/>
    <line x1="60" y1="60" x2="160" y2="100" stroke="#5a8fff" stroke-width="3"/>
    <line x1="60" y1="60" x2="20" y2="140" stroke="#5a8fff" stroke-width="3"/>
    <line x1="160" y1="20" x2="220" y2="80" stroke="#5a8fff" stroke-width="3"/>
    <line x1="160" y1="100" x2="220" y2="80" stroke="#5a8fff" stroke-width="3"/>
    <line x1="20" y1="140" x2="160" y2="100" stroke="#5a8fff" stroke-width="3"/>
    <!-- 节点 (圆) -->
    <circle cx="60" cy="60" r="20" fill="url(#brain)"/>
    <circle cx="160" cy="20" r="16" fill="url(#brain)"/>
    <circle cx="160" cy="100" r="16" fill="url(#brain)"/>
    <circle cx="20" cy="140" r="14" fill="url(#brain)"/>
    <circle cx="220" cy="80" r="22" fill="url(#brain)"/>
  </g>

  <!-- 大 SSH prompt -->
  <g transform="translate(160, 540)">
    <!-- ai 标签 (左上小字) -->
    <text x="0" y="0" font-family="Menlo, monospace" font-size="56" font-weight="bold" fill="#5a8fff">ai</text>
    <text x="120" y="0" font-family="Menlo, monospace" font-size="56" font-weight="bold" fill="#cbcccd">@</text>
    <!-- ssh 标签 -->
    <text x="170" y="0" font-family="Menlo, monospace" font-size="56" font-weight="bold" fill="#27c93f">ssh</text>

    <!-- prompt $ -->
    <text x="0" y="100" font-family="Menlo, monospace" font-size="120" font-weight="bold" fill="#27c93f">$</text>
    <!-- 闪烁光标 -->
    <rect x="100" y="20" width="40" height="100" fill="#27c93f" opacity="0.85"/>
  </g>

  <!-- 底部光晕 -->
  <ellipse cx="512" cy="850" rx="300" ry="40" fill="url(#glow)"/>
</svg>
