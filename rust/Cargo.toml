[workspace]
resolver = "2"
members = ["core", "bin", "daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "process", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
regex = "1"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
which = "6"
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3