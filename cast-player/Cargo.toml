[package]
name = "cast-player"
version = "0.1.0"
edition = "2021"

[lib]
name = "cast_player_lib"
path = "src/lib.rs"

[[bin]]
name = "cast-player"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
csv = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
